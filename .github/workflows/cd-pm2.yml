name: CD - Deploy via SSH & PM2 (No Docker)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Verify build compiles
        run: npm run build

  deploy-to-server:
    name: Deploy to VPS (PM2)
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on $(hostname)..."

            # 1. Navigate to project directory
            APP_DIR="${{ secrets.APP_DIR || '/var/www/my-app' }}"
            cd $APP_DIR

            # 2. Pull latest code from GitHub
            echo "📥 Pulling latest code..."
            git pull origin main

            # 3. Install dependencies
            echo "📦 Installing dependencies..."
            npm ci

            # 4. Build Next.js application
            echo "🏗️ Building Next.js..."
            npm run build

            # 5. Reload PM2 with Zero-Downtime
            echo "🔄 Reloading PM2 process..."
            if pm2 describe next-front > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js
            fi

            # 6. Save PM2 state for auto-restart on server reboot
            pm2 save

            echo "✅ Deployment completed successfully without Docker!"
