name: CD - Deploy to Ubuntu Server via PM2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Verify build compiles
        run: npm run build

  deploy-to-server:
    name: Deploy to Ubuntu Server
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connecting to $(hostname)..."

            # Ensure Node, npm, and PM2 are in PATH for non-login SSH session
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
            if [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi

            APP_DIR="${{ secrets.APP_DIR || '/var/www/my-app' }}"
            echo "📂 Deploying to: $APP_DIR"
            cd $APP_DIR

            # Ensure safe Git directory
            git config --global --add safe.directory $APP_DIR

            # Pull latest changes from GitHub
            echo "📥 Fetching latest code..."
            git pull origin main

            # Install dependencies
            echo "📦 Installing npm dependencies..."
            npm ci

            # Build production Next.js bundle
            echo "🏗️ Building Next.js application..."
            npm run build

            # Zero-downtime PM2 reload
            echo "🔄 Reloading PM2 with zero downtime..."
            if pm2 describe next-front > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js
            fi

            # Save state for auto-reboot
            pm2 save

            echo "🎉 Deployment successfully finished on Ubuntu server!"
